name: Temporary HONOR200 IME OpenCode APK

on:
  push:
    branches:
      - fix/ime-tui-resize-honor200-20261005
      - feat/smart-environments-menu-20261005
      - feat/token-saver-profiles-20261005
      - fix/play-store-detach-20261005
      - fix/9router-start-no-pkg-20261005

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build direct ARM64 APK
        env:
          TERMUX_ABIS: arm64-v8a
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '1'
          TERMUX_APP_VERSION_NAME: 1.6.2-direct
          NEWTERMUX_VERSION_CODE: '202610051'
          TERMUX_APK_VERSION_TAG: 1.6.2-direct-ime-opencode-20261005
        run: |
          set -euo pipefail
          ./gradlew assembleDirectDebug --no-daemon

      - name: Verify direct identity and collect artifact
        run: |
          set -euo pipefail
          DIR=app/build/outputs/apk/direct/debug
          META="$DIR/output-metadata.json"
          APK="$(find "$DIR" -maxdepth 1 -type f -name '*arm64-v8a.apk' -print -quit)"
          test -n "$APK"
          test -f "$META"

          python3 - "$META" "$APK" <<'PY'
          import io, json, sys, zipfile
          metadata_path, apk_path = sys.argv[1:]
          with open(metadata_path, encoding="utf-8") as stream:
              metadata = json.load(stream)
          assert metadata.get("applicationId") == "com.termux", metadata
          assert metadata.get("variantName") == "directDebug", metadata
          elements = metadata.get("elements") or []
          assert elements and elements[0].get("versionCode") == 202610051, metadata
          with zipfile.ZipFile(apk_path) as apk:
              bootstrap = apk.read("lib/arm64-v8a/libtermux-bootstrap.so")
          with zipfile.ZipFile(io.BytesIO(bootstrap)) as archive:
              login = archive.read("bin/login").decode("utf-8")
          assert login.splitlines()[0] == "#!/data/data/com.termux/files/usr/bin/sh"
          print("PASS com.termux standalone ARM64 / versionCode 202610051")
          PY

          cp "$APK" "$RUNNER_TEMP/NewTermux-IME-OPENCODE-HONOR200-arm64.apk"
          sha256sum "$RUNNER_TEMP/NewTermux-IME-OPENCODE-HONOR200-arm64.apk"             | tee "$RUNNER_TEMP/NewTermux-IME-OPENCODE-HONOR200-arm64.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: NewTermux-IME-OPENCODE-HONOR200-arm64
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/NewTermux-IME-OPENCODE-HONOR200-arm64.apk
            ${{ runner.temp }}/NewTermux-IME-OPENCODE-HONOR200-arm64.sha256
            app/build/outputs/apk/direct/debug/output-metadata.json
