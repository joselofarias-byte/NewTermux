name: Temporary UI compile check

on:
  push:
    branches:
      - fix/spanish-terminal-actions-20260926

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TERMUX_ABIS: arm64-v8a
      TERMUX_PACKAGE_VARIANT: apt-android-7
      TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Android sources and resources
        run: |
          ./gradlew             :app:compilePlaycompatDebugJavaWithJavac             :app:compilePlaycompatDebugKotlin             --no-daemon --stacktrace
