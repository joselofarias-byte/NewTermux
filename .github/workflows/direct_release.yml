name: Build signed standalone release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'NewTermux versionName (SemVer)'
        required: true
        default: '1.6.2-direct.1'
      version_code:
        description: 'Monotonic Android versionCode'
        required: true
        default: '29'

permissions:
  contents: read

concurrency:
  group: newtermux-direct-release
  cancel-in-progress: false

jobs:
  build-signed-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Require standalone signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.NEWTERMUX_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.NEWTERMUX_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEWTERMUX_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEWTERMUX_RELEASE_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.NEWTERMUX_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_SHA256; do
            test -n "${!name}" || { echo "::error::Missing required NewTermux release signing secret: $name"; exit 2; }
          done

      - name: Materialize release keystore
        env:
          KEYSTORE_B64: ${{ secrets.NEWTERMUX_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/newtermux-release.jks"
          chmod 600 "$RUNNER_TEMP/newtermux-release.jks"
          test -s "$RUNNER_TEMP/newtermux-release.jks"

      - name: Build signed directRelease ARM64
        env:
          TERMUX_ABIS: arm64-v8a
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: '1'
          TERMUX_APP_VERSION_NAME: ${{ inputs.version_name }}
          NEWTERMUX_VERSION_CODE: ${{ inputs.version_code }}
          TERMUX_APK_VERSION_TAG: newtermux-${{ inputs.version_name }}-direct
          NEWTERMUX_SIGNING_STORE_FILE: ${{ runner.temp }}/newtermux-release.jks
          NEWTERMUX_SIGNING_STORE_PASSWORD: ${{ secrets.NEWTERMUX_RELEASE_STORE_PASSWORD }}
          NEWTERMUX_SIGNING_KEY_ALIAS: ${{ secrets.NEWTERMUX_RELEASE_KEY_ALIAS }}
          NEWTERMUX_SIGNING_KEY_PASSWORD: ${{ secrets.NEWTERMUX_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDirectRelease --no-daemon

      - name: Verify signed APK, identity and PREFIX
        id: verify
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.NEWTERMUX_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          DIR=app/build/outputs/apk/direct/release
          META="$DIR/output-metadata.json"
          APK="$(find "$DIR" -maxdepth 1 -type f -name '*arm64-v8a.apk' -print -quit)"
          test -n "$APK"
          test -f "$META"

          python3 - "$META" "$APK" <<'PY'
          import io
          import json
          import sys
          import zipfile

          metadata_path, apk_path = sys.argv[1:]
          with open(metadata_path, encoding="utf-8") as stream:
              metadata = json.load(stream)

          assert metadata.get("applicationId") == "com.termux", metadata
          assert metadata.get("variantName") == "directRelease", metadata

          with zipfile.ZipFile(apk_path) as apk:
              bootstrap = apk.read("lib/arm64-v8a/libtermux-bootstrap.so")

          with zipfile.ZipFile(io.BytesIO(bootstrap)) as archive:
              names = set(archive.namelist())
              login = archive.read("bin/login").decode("utf-8")

          assert login.splitlines()[0] == "#!/data/data/com.termux/files/usr/bin/sh"
          assert "lib/libandroid-support.so" in names
          PY

          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$APK.cert.txt"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED" || { echo "::error::Unexpected signing certificate"; exit 3; }

          sha256sum "$APK" | tee "$APK.sha256"
          printf 'apk=%s\n' "$APK" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$APK.sha256" >> "$GITHUB_OUTPUT"
          printf 'cert=%s\n' "$APK.cert.txt" >> "$GITHUB_OUTPUT"

      - name: Upload signed standalone candidate
        uses: actions/upload-artifact@v6
        with:
          name: NewTermux-directRelease-ARM64-${{ inputs.version_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ steps.verify.outputs.apk }}
            ${{ steps.verify.outputs.sha }}
            ${{ steps.verify.outputs.cert }}
            app/build/outputs/apk/direct/release/output-metadata.json
