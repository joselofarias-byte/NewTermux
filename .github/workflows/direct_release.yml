name: Build signed standalone release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'NewTermux versionName (SemVer)'
        required: true
        default: '1.6.2-direct.1'
      version_code:
        description: 'Monotonic Android versionCode'
        required: true
        default: '29'
  push:
    branches:
      - feat/standalone-distribution-20260929
    paths:
      - '.github/release-trigger/direct-candidate'

permissions:
  contents: read

concurrency:
  group: newtermux-direct-release
  cancel-in-progress: false

jobs:
  build-signed-arm64:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.version_name || '1.6.2-direct.1' }}
      RELEASE_VERSION_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.version_code || '29' }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Require new private signing-key secrets
        env:
          KEYSTORE_B64: ${{ secrets.NEWTERMUX_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.NEWTERMUX_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEWTERMUX_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEWTERMUX_RELEASE_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.NEWTERMUX_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_SHA256; do
            test -n "${!name}" || { echo "::error::Missing required NewTermux release signing secret: $name"; exit 2; }
          done

      - name: Materialize new private release keystore
        env:
          KEYSTORE_B64: ${{ secrets.NEWTERMUX_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/newtermux-release.p12"
          chmod 600 "$RUNNER_TEMP/newtermux-release.p12"
          test -s "$RUNNER_TEMP/newtermux-release.p12"

      - name: Verify old and new signing certificates
        env:
          NEW_STORE_PASSWORD: ${{ secrets.NEWTERMUX_RELEASE_STORE_PASSWORD }}
          NEW_KEY_ALIAS: ${{ secrets.NEWTERMUX_RELEASE_KEY_ALIAS }}
          EXPECTED_NEW_CERT: ${{ secrets.NEWTERMUX_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          normalize() { tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]'; }

          OLD_CERT="$(
            keytool -J-Duser.language=en -list -v               -keystore app/testkey_untrusted.jks               -storepass xrj45yWGLbsO7W0v               -alias alias |
              sed -n 's/^[[:space:]]*SHA256: //p' |
              head -1 | normalize
          )"
          EXPECTED_OLD="b6da01480eefd5fbf2cd3771b8d1021ec791304bdd6c4bf41d3faabad48ee5e1"
          test "$OLD_CERT" = "$EXPECTED_OLD" || {
            echo "::error::Unexpected predecessor signing certificate"
            exit 3
          }

          NEW_CERT="$(
            keytool -J-Duser.language=en -list -v               -keystore "$RUNNER_TEMP/newtermux-release.p12"               -storepass "$NEW_STORE_PASSWORD"               -alias "$NEW_KEY_ALIAS" |
              sed -n 's/^[[:space:]]*SHA256: //p' |
              head -1 | normalize
          )"
          EXPECTED_NEW="$(printf '%s' "$EXPECTED_NEW_CERT" | normalize)"
          test -n "$NEW_CERT"
          test "$NEW_CERT" = "$EXPECTED_NEW" || {
            echo "::error::New release certificate does not match NEWTERMUX_RELEASE_CERT_SHA256"
            exit 4
          }

          echo "OLD_CERT_SHA256=$OLD_CERT"
          echo "NEW_CERT_SHA256=$NEW_CERT"

      - name: Build unsigned directRelease ARM64 for controlled post-signing
        env:
          TERMUX_ABIS: arm64-v8a
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: '1'
          TERMUX_APP_VERSION_NAME: ${{ env.RELEASE_VERSION_NAME }}
          NEWTERMUX_VERSION_CODE: ${{ env.RELEASE_VERSION_CODE }}
          TERMUX_APK_VERSION_TAG: newtermux-${{ env.RELEASE_VERSION_NAME }}-direct
          NEWTERMUX_ALLOW_UNSIGNED_DIRECT_RELEASE: '1'
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDirectRelease --no-daemon

      - name: Create signing lineage and sign rotated APK
        id: sign
        env:
          NEW_STORE_PASSWORD: ${{ secrets.NEWTERMUX_RELEASE_STORE_PASSWORD }}
          NEW_KEY_ALIAS: ${{ secrets.NEWTERMUX_RELEASE_KEY_ALIAS }}
          NEW_KEY_PASSWORD: ${{ secrets.NEWTERMUX_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          DIR=app/build/outputs/apk/direct/release
          META="$DIR/output-metadata.json"
          UNSIGNED="$(find "$DIR" -maxdepth 1 -type f -name '*arm64-v8a*.apk' -print -quit)"
          test -n "$UNSIGNED"
          test -f "$META"

          ALIGNED="$RUNNER_TEMP/NewTermux-directRelease-arm64-aligned.apk"
          FINAL="$RUNNER_TEMP/NewTermux-${{ env.RELEASE_VERSION_NAME }}-direct-arm64-v8a.apk"
          LINEAGE="$RUNNER_TEMP/newtermux-signing-lineage"

          "$ZIPALIGN" -p -f 4 "$UNSIGNED" "$ALIGNED"

          "$APKSIGNER" rotate             --out "$LINEAGE"             --old-signer             --ks app/testkey_untrusted.jks             --ks-key-alias alias             --ks-pass pass:xrj45yWGLbsO7W0v             --key-pass pass:xrj45yWGLbsO7W0v             --new-signer             --ks "$RUNNER_TEMP/newtermux-release.p12"             --ks-key-alias "$NEW_KEY_ALIAS"             --ks-pass "pass:$NEW_STORE_PASSWORD"             --key-pass "pass:$NEW_KEY_PASSWORD"

          cp "$ALIGNED" "$FINAL"

          "$APKSIGNER" sign             --ks app/testkey_untrusted.jks             --ks-key-alias alias             --ks-pass pass:xrj45yWGLbsO7W0v             --key-pass pass:xrj45yWGLbsO7W0v             --next-signer             --ks "$RUNNER_TEMP/newtermux-release.p12"             --ks-key-alias "$NEW_KEY_ALIAS"             --ks-pass "pass:$NEW_STORE_PASSWORD"             --key-pass "pass:$NEW_KEY_PASSWORD"             --lineage "$LINEAGE"             --rotation-min-sdk-version 33             "$FINAL"

          printf 'apk=%s\n' "$FINAL" >> "$GITHUB_OUTPUT"
          printf 'lineage=%s\n' "$LINEAGE" >> "$GITHUB_OUTPUT"
          printf 'meta=%s\n' "$META" >> "$GITHUB_OUTPUT"

      - name: Verify rotated signature, identity and PREFIX
        id: verify
        env:
          EXPECTED_NEW_CERT_SHA256: ${{ secrets.NEWTERMUX_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK='${{ steps.sign.outputs.apk }}'
          LINEAGE='${{ steps.sign.outputs.lineage }}'
          META='${{ steps.sign.outputs.meta }}'
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          normalize() { tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]'; }

          python3 - "$META" "$APK" <<'PY'
          import io
          import json
          import sys
          import zipfile

          metadata_path, apk_path = sys.argv[1:]
          with open(metadata_path, encoding="utf-8") as stream:
              metadata = json.load(stream)

          assert metadata.get("applicationId") == "com.termux", metadata
          assert metadata.get("variantName") == "directRelease", metadata

          with zipfile.ZipFile(apk_path) as apk:
              bootstrap = apk.read("lib/arm64-v8a/libtermux-bootstrap.so")

          with zipfile.ZipFile(io.BytesIO(bootstrap)) as archive:
              names = set(archive.namelist())
              login = archive.read("bin/login").decode("utf-8")

          assert login.splitlines()[0] == "#!/data/data/com.termux/files/usr/bin/sh"
          assert "lib/libandroid-support.so" in names
          PY

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$APK.cert.txt"

          # Rotated APKs are reported as V3.1/V3.0 signers, not as "Signer #1".
          # Parse the already verified report so the gate checks the signer Android
          # 13+ will use and the predecessor retained for Android 12 and below.
          NEW_ACTUAL="$(
            sed -n 's/^V3\.1 Signer: .*certificate SHA-256 digest: //p' "$APK.cert.txt" |
              head -1 | normalize
          )"
          EXPECTED_NEW="$(printf '%s' "$EXPECTED_NEW_CERT_SHA256" | normalize)"
          test -n "$NEW_ACTUAL" || {
            echo "::error::No V3.1 rotated signer found for Android 13+"
            exit 5
          }
          test "$NEW_ACTUAL" = "$EXPECTED_NEW" || {
            echo "::error::Android 13+ signer is not the rotated private certificate"
            exit 5
          }

          OLD_ACTUAL="$(
            sed -n 's/^V3\.0 Signer: .*certificate SHA-256 digest: //p' "$APK.cert.txt" |
              head -1 | normalize
          )"
          EXPECTED_OLD="b6da01480eefd5fbf2cd3771b8d1021ec791304bdd6c4bf41d3faabad48ee5e1"
          test -n "$OLD_ACTUAL" || {
            echo "::error::No V3.0 predecessor signer found for Android 12 and below"
            exit 6
          }
          test "$OLD_ACTUAL" = "$EXPECTED_OLD" || {
            echo "::error::Pre-Android-13 predecessor signer is not preserved"
            exit 6
          }

          sha256sum "$APK" | tee "$APK.sha256"
          sha256sum "$LINEAGE" | tee "$LINEAGE.sha256"
          printf 'apk=%s\n' "$APK" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$APK.sha256" >> "$GITHUB_OUTPUT"
          printf 'cert=%s\n' "$APK.cert.txt" >> "$GITHUB_OUTPUT"
          printf 'lineage=%s\n' "$LINEAGE" >> "$GITHUB_OUTPUT"
          printf 'lineage_sha=%s\n' "$LINEAGE.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload rotated standalone candidate
        uses: actions/upload-artifact@v6
        with:
          name: NewTermux-directRelease-ARM64-${{ env.RELEASE_VERSION_NAME }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ steps.verify.outputs.apk }}
            ${{ steps.verify.outputs.sha }}
            ${{ steps.verify.outputs.cert }}
            ${{ steps.verify.outputs.lineage }}
            ${{ steps.verify.outputs.lineage_sha }}
            ${{ steps.sign.outputs.meta }}
