name: Fase4 bootstrap inventory

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Host / cloud Fase 4 checks
        run: |
          chmod +x scripts/fase4/*.sh
          bash scripts/fase4/host-checks.sh
