name: Fase6 guard

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan for unexpected keys and tokens
        run: |
          chmod +x scripts/fase6/secret-scan.sh
          bash scripts/fase6/secret-scan.sh

  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v5

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Terminal emulator unit tests (coexistDebug)
        run: ./gradlew :terminal-emulator:testCoexistDebugUnitTest --no-daemon
