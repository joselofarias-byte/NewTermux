name: Temporary context menu fix APK

on:
  push:
    branches:
      - fix/playcompat-spanish-terminal-ui-20260926

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Assert direct playcompat identity
        run: bash scripts/fase8/assert-playcompat-stock-bootstrap.sh

      - name: Build direct ARM64 APK
        env:
          TERMUX_ABIS: arm64-v8a
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '1'
          TERMUX_APP_VERSION_NAME: 1.6.2-playcompat
          TERMUX_APK_VERSION_TAG: 1.6.2-playcompat-contextfix-20260927
        run: |
          set -euo pipefail
          ./gradlew assemblePlaycompatDebug --no-daemon

      - name: Verify and stage APK
        id: verify
        run: |
          set -euo pipefail
          DIR=app/build/outputs/apk/playcompat/debug
          META="$DIR/output-metadata.json"
          APK="$(find "$DIR" -maxdepth 1 -type f -name '*arm64-v8a.apk' -print -quit)"
          test -n "$APK"
          test -f "$META"

          python3 - "$META" "$APK" <<'PY'
          import io, json, sys, zipfile
          metadata_path, apk_path = sys.argv[1:]
          with open(metadata_path, encoding="utf-8") as stream:
              metadata = json.load(stream)
          assert metadata.get("applicationId") == "com.termux", metadata
          assert metadata.get("variantName") == "playcompatDebug", metadata
          with zipfile.ZipFile(apk_path) as apk:
              bootstrap = apk.read("lib/arm64-v8a/libtermux-bootstrap.so")
          with zipfile.ZipFile(io.BytesIO(bootstrap)) as archive:
              login = archive.read("bin/login").decode("utf-8")
              names = set(archive.namelist())
          assert login.splitlines()[0] == "#!/data/data/com.termux/files/usr/bin/sh"
          assert "lib/libandroid-support.so" in names
          print("PASS applicationId=com.termux")
          print("PASS variantName=playcompatDebug")
          print("PASS bootstrap prefix=/data/data/com.termux/files/usr")
          PY

          OUT="$RUNNER_TEMP/NewTermux-contextfix-HONOR200-arm64.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"

      - name: Upload artifact
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: NewTermux-contextfix-HONOR200-arm64
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/NewTermux-contextfix-HONOR200-arm64.apk
            ${{ runner.temp }}/NewTermux-contextfix-HONOR200-arm64.apk.sha256
            app/build/outputs/apk/playcompat/debug/output-metadata.json

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          tag="newtermux-contextfix-$short"
          gh release create "$tag" \
            "$RUNNER_TEMP/NewTermux-contextfix-HONOR200-arm64.apk#NewTermux-contextfix-HONOR200-arm64.apk" \
            "$RUNNER_TEMP/NewTermux-contextfix-HONOR200-arm64.apk.sha256#NewTermux-contextfix-HONOR200-arm64.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "NewTermux context menu fix $short" \
            --notes "HONOR 200 ARM64 playcompat build. Fixes the Output and files submenu id collision that incorrectly triggered URL selection."
