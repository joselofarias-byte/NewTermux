name: Verify GitHub build fix

on:
  push:
    branches:
      - fix/github-build-20260815

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [apt-android-5, apt-android-7]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APKs
        env:
          TERMUX_PACKAGE_VARIANT: ${{ matrix.variant }}
        run: |
          chmod +x gradlew
          CURRENT_VERSION_NAME="$(grep -m1 -E '^[[:space:]]+versionName "' app/build.gradle | sed -E 's/.*versionName "([^"]+)".*/\1/')"
          export TERMUX_APP_VERSION_NAME="${CURRENT_VERSION_NAME}+${GITHUB_SHA:0:7}"
          export TERMUX_APK_VERSION_TAG="v${TERMUX_APP_VERSION_NAME}-${{ matrix.variant }}-github-debug"
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: newtermux-${{ matrix.variant }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
