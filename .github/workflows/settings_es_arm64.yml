name: Spanish settings - direct ARM64

on:
  push:
    branches:
      - fix/settings-es-complete-20260927
      - agent/newtermux-extra-key-colors-20260928
    paths:
      - '.github/workflows/settings_es_arm64.yml'
      - 'scripts/i18n/**'
      - 'app/src/main/**'
      - 'termux-shared/src/main/**'

permissions:
  contents: write

concurrency:
  group: settings-es-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TERMUX_ABIS: arm64-v8a
      TERMUX_PACKAGE_VARIANT: apt-android-7
      TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '1'
      TERMUX_APP_VERSION_NAME: 1.6.2-playcompat.es7
      TERMUX_APK_VERSION_TAG: 1.6.2-playcompat-es7-20260928
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Generate and validate reviewed resources
        run: |
          set -euo pipefail
          # Logger supplies CharSequence[] rather than int[]. Keep the generated
          # source and its one-shot migration in sync; this is a no-op after commit.
          python3 - <<'PY'
          from pathlib import Path
          before = "    val labels = Logger.getLogLevelsArray().map { level ->\n        val label = when (level) {"
          after = "    val labels = values.map { rawLevel ->\n        val level = rawLevel.toInt()\n        val label = when (level) {"
          logger = Path('termux-shared/src/main/java/com/termux/shared/logger/Logger.java').read_text()
          assert 'public static CharSequence[] getLogLevelsArray()' in logger
          paths = [Path('scripts/i18n/localize-settings-es.py')]
          settings = Path('app/src/main/java/com/termux/app/activities/SettingsActivity.kt')
          if Path('app/src/main/res/values-es/newtermux_settings_strings.xml').exists():
              paths.append(settings)
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if before in text:
                  assert text.count(before) == 1, path
                  path.write_text(text.replace(before, after), encoding='utf-8')
              else:
                  assert after in text, f'Unexpected log-level implementation: {path}'
          print('PASS log-level values are parsed as integers before label selection')
          PY
          python3 -m py_compile scripts/i18n/localize-settings-es.py
          if test -f app/src/main/res/values-es/newtermux_settings_strings.xml; then
            python3 scripts/i18n/localize-settings-es.py --check
          else
            python3 scripts/i18n/localize-settings-es.py
          fi
          git diff --check
          git diff --stat

      - name: Assert complete Spanish resource coverage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          pairs = [
              ('app/src/main/res/values/strings.xml', 'app/src/main/res/values-es/strings.xml'),
              ('app/src/main/res/values/newtermux_settings_strings.xml',
               'app/src/main/res/values-es/newtermux_settings_strings.xml'),
          ]

          def names(path):
              root = ET.parse(path).getroot()
              return {node.attrib['name'] for node in root if node.tag == 'string' and 'name' in node.attrib}

          for default_path, es_path in pairs:
              default = names(default_path)
              spanish = names(es_path)
              missing = sorted(default - spanish)
              assert not missing, f'{es_path} missing: {missing}'
              print(f'PASS {es_path}: {len(default)} default strings covered')

          forbidden = {
              'app/src/main/java/com/termux/app/TermuxActivity.java': [
                  'Screen exported', 'Export failed:', 'Script saved', 'Save failed:',
                  'Did you mean:', 'Export Screen', 'Make Script', 'Pkg Update',
                  'long press to set', 'Button label', 'Edit Button',
                  'No history file found', 'Failed to read history',
                  'No commands selected', 'Microphone permission required for speech input',
              ],
              'app/src/main/java/com/termux/app/terminal/TermuxTerminalViewClient.java': [
                  'Open in browser', 'Copy to clipboard', ' Report Issue',
              ],
              'app/src/main/java/com/newtermux/features/SpeechInputManager.java': [
                  'Speech recognition not available on this device.',
                  'Speak a command...', 'Audio recording error', 'Microphone permission denied',
                  'No speech recognized', 'Unknown error (',
              ],
              'app/src/main/res/layout/bottom_sheet_session_options.xml': [
                  'android:text="Session"', 'android:text="Rename"', 'android:text="Close session"',
              ],
              'app/src/main/res/layout/newtermux_autocorrect_bar.xml': [
                  'Did you mean: ls?', 'android:text="Apply"',
              ],
              'app/src/main/res/layout/newtermux_stt_overlay.xml': [
                  'Listening...',
              ],
          }
          for path, needles in forbidden.items():
              raw = Path(path).read_text(encoding='utf-8')
              data = '\n'.join(
                  line for line in raw.splitlines()
                  if not line.lstrip().startswith(('//', '*', '<!--'))
              )
              found = [needle for needle in needles if needle in data]
              assert not found, f'English UI literals remain in {path}: {found}'
          print('PASS audited NewTermux UI has no known English literals')
          PY

      - name: Commit generated application source without starting another build
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/i18n/localize-settings-es.py \
            app/src/main/java/com/termux/app/activities/SettingsActivity.kt \
            app/src/main/java/com/termux/app/activities/FileManagerActivity.kt \
            app/src/main/java/com/termux/app/activities/SshManagerActivity.kt \
            app/src/main/java/com/termux/app/activities/ThemePickerActivity.kt \
            app/src/main/java/com/newtermux/features/ColorPickerDialog.java \
            app/src/main/res/layout/dialog_color_picker_hsv.xml \
            app/src/main/res/values/newtermux_settings_strings.xml \
            app/src/main/res/values-es/newtermux_settings_strings.xml
          if ! git diff --cached --quiet; then
            git commit -m 'fix(i18n): commit validated settings resources and typed log levels [skip ci]'
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Assert unchanged direct playcompat identity
        run: bash scripts/fase8/assert-playcompat-stock-bootstrap.sh

      - name: Unit tests and direct ARM64 build
        run: ./gradlew :app:testPlaycompatDebugUnitTest :app:assemblePlaycompatDebug --no-daemon

      - name: Verify packaged Spanish resources, bootstrap and signature
        run: |
          set -euo pipefail
          python3 scripts/i18n/localize-settings-es.py --check
          DIR=app/build/outputs/apk/playcompat/debug
          META="$DIR/output-metadata.json"
          APK="$(find "$DIR" -maxdepth 1 -type f -name '*arm64-v8a.apk' -print -quit)"
          test -n "$APK"
          python3 - "$META" "$APK" <<'PY'
          import io, json, sys, zipfile
          from pathlib import Path
          metadata = json.loads(Path(sys.argv[1]).read_text())
          assert metadata['applicationId'] == 'com.termux', metadata
          assert metadata['variantName'] == 'playcompatDebug', metadata
          with zipfile.ZipFile(sys.argv[2]) as apk:
              bootstrap = apk.read('lib/arm64-v8a/libtermux-bootstrap.so')
              assert not any(n.startswith(('lib/x86/', 'lib/x86_64/', 'lib/armeabi-v7a/')) for n in apk.namelist())
          with zipfile.ZipFile(io.BytesIO(bootstrap)) as archive:
              login = archive.read('bin/login').decode('utf-8')
          assert login.splitlines()[0] == '#!/data/data/com.termux/files/usr/bin/sh'
          print('PASS com.termux direct ARM64 with original bootstrap prefix')
          PY
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$AAPT" && test -n "$SIGNER"
          "$AAPT" dump resources "$APK" > "$RUNNER_TEMP/resources-dump.txt"
          python3 - "$RUNNER_TEMP/resources-dump.txt" <<'PY'
          import sys
          from pathlib import Path
          data = Path(sys.argv[1]).read_text(encoding='utf-8')
          for expected in ('Ajustes', 'Atajos de texto', 'Gestor de archivos', 'Agregar atajo', 'Brillo', 'Exportar pantalla', 'Crear script', 'Escuchando', 'Abrir en el navegador', 'Mantener NewTermux en ejecución'):
              assert expected in data, expected
          print('PASS Spanish labels found inside the compiled APK')
          PY
          "$SIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/signature.txt"
          mkdir -p "$RUNNER_TEMP/es-delivery"
          cp "$APK" "$RUNNER_TEMP/es-delivery/NewTermux-TBM-PERSONAL-GAP-HONOR200-arm64.apk"
          cp "$META" "$RUNNER_TEMP/es-delivery/output-metadata.json"
          cp "$RUNNER_TEMP/signature.txt" "$RUNNER_TEMP/es-delivery/signature.txt"
          (
            cd "$RUNNER_TEMP/es-delivery"
            sha256sum NewTermux-TBM-PERSONAL-GAP-HONOR200-arm64.apk > SHA256SUMS.txt
          )
          printf 'SOURCE_SHA=%s\nBASE_SHA=%s\nRUN_ID=%s\nPHYSICAL_VALIDATION=PENDING\n' \
            "$SOURCE_SHA" '343069e32d055101d006c501db5f7e4fa6db2a66' "$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/es-delivery/VALIDATION.txt"
          git diff 343069e32d055101d006c501db5f7e4fa6db2a66 "$SOURCE_SHA" -- app/src/main \
            > "$RUNNER_TEMP/es-delivery/settings-spanish.patch"
          python3 scripts/i18n/localize-settings-es.py --check | tee "$RUNNER_TEMP/es-delivery/resource-checks.txt"
          python3 - <<'PY' | tee "$RUNNER_TEMP/es-delivery/unit-tests.txt"
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports = list(Path('app/build/test-results/testPlaycompatDebugUnitTest').glob('TEST-*.xml'))
          totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          for report in reports:
              suite = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(suite.attrib.get(key, 0))
          assert totals['failures'] == 0 and totals['errors'] == 0, totals
          print('XML_REPORTS=' + str(len(reports)))
          for key, value in totals.items():
              print(key.upper() + '=' + str(value))
          print('PHYSICAL_VALIDATION=PENDING')
          PY

      - name: Upload the single ARM64 delivery
        uses: actions/upload-artifact@v6
        with:
          name: NewTermux-TBM-PERSONAL-GAP-HONOR200-arm64
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
          path: ${{ runner.temp }}/es-delivery/
