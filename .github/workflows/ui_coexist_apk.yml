name: NewTermux UI coexist APK

on:
  push:
    branches:
      - fix/spanish-terminal-actions-20260926

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TERMUX_ABIS: arm64-v8a
      TERMUX_PACKAGE_VARIANT: apt-android-7
      TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '1'
      TERMUX_APK_VERSION_TAG: ui-spanish-context-20260926
      SOURCE_BOOTSTRAP_RUN: '36247646929'
      SOURCE_BOOTSTRAP_ARTIFACT: newtermux-prefix-aware-bootstrap-aarch64

    steps:
      - name: Checkout UI branch
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reuse verified com.newtermux.dev bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bootstrap-artifact" "$RUNNER_TEMP/newtermux-bootstrap"
          gh run download "$SOURCE_BOOTSTRAP_RUN"             -R "${{ github.repository }}"             -n "$SOURCE_BOOTSTRAP_ARTIFACT"             -D "$RUNNER_TEMP/bootstrap-artifact"
          zip="$(find "$RUNNER_TEMP/bootstrap-artifact" -type f -name 'bootstrap-aarch64.zip' -print -quit)"
          test -n "$zip"
          cp "$zip" "$RUNNER_TEMP/newtermux-bootstrap/bootstrap-aarch64.zip"
          echo "NEWTERMUX_BOOTSTRAP_DIR=$RUNNER_TEMP/newtermux-bootstrap" >> "$GITHUB_ENV"
          sha256sum "$RUNNER_TEMP/newtermux-bootstrap/bootstrap-aarch64.zip"
          chmod +x scripts/fase8/verify-bootstrap-prefix.sh
          scripts/fase8/verify-bootstrap-prefix.sh             "$RUNNER_TEMP/newtermux-bootstrap/bootstrap-aarch64.zip"             com.newtermux.dev

      - name: Build coexist ARM64 APK
        run: |
          set -euo pipefail
          ./gradlew assembleCoexistDebug --no-daemon
          out=app/build/outputs/apk/coexist/debug
          apk="$(find "$out" -maxdepth 1 -type f -name '*arm64-v8a.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" "$RUNNER_TEMP/NewTermux-UI-ES-HONOR200-arm64.apk"
          sha256sum "$RUNNER_TEMP/NewTermux-UI-ES-HONOR200-arm64.apk"             | tee "$RUNNER_TEMP/NewTermux-UI-ES-HONOR200-arm64.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: NewTermux-UI-ES-HONOR200-arm64
          retention-days: 7
          path: |
            ${{ runner.temp }}/NewTermux-UI-ES-HONOR200-arm64.apk
            ${{ runner.temp }}/NewTermux-UI-ES-HONOR200-arm64.sha256
