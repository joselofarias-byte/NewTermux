name: NewTermux Full Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        default: 'v1.6.0'

jobs:
  build-apk:
    name: Build NewTermux APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Refuse debug APK as GitHub Release
        run: |
          echo "Fase 6: coexist debug APKs are CI artifacts only (DEBUG-NOT-RELEASE)."
          echo "See docs/NEWTERMUX_FASE6_BUILD_CI_2026-09-19.md"
          exit 2

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APKs
        run: |
          chmod +x ./gradlew
          # Do not assemblePlaycompatDebug: that APK is com.termux and would collide with Play.
          ./gradlew assembleCoexistDebug assemblePlaycompatDemo

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/coexist/debug/*.apk
            app/build/outputs/apk/playcompat/demo/*.apk
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-pre') }}
          generate_release_notes: true
          body: |
            ## NewTermux ${{ github.ref_name }}

            ### Installation
            Download the APK for your architecture:
            - `arm64-v8a` — most modern Android phones
            - `armeabi-v7a` — older 32-bit ARM devices
            - `x86_64` / `x86` — emulators and x86 devices
            - `universal` — works on all devices (larger file size)

            ### Try Before You Switch
            Download `newtermux-test-coexist_..._universal.apk` to try the fake-shell UI **without** uninstalling Termux Play (`com.termux.demo`). The debug APKs from this workflow install as `com.newtermux.dev` and do not update Termux Play.

            > **Note:** Play-compatible `com.termux` APKs are not attached here. Installing a `com.termux` build over Termux Play (or the reverse) can collide on sharedUserId and private data.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
