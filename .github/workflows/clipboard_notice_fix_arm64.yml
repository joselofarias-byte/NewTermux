name: Clipboard notice fix ARM64

on:
  push:
    branches:
      - fix/clipboard-access-notice-20260929
    paths:
      - 'app/src/main/java/com/newtermux/features/ClipboardAccessNoticeManager.java'
      - 'app/src/main/java/com/termux/app/TermuxApplication.java'
      - 'app/src/main/java/com/termux/app/event/SystemEventReceiver.java'
      - '.github/workflows/clipboard_notice_fix_arm64.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TERMUX_ABIS: arm64-v8a
      TERMUX_PACKAGE_VARIANT: apt-android-7
      TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '1'
      TERMUX_APP_VERSION_NAME: 1.6.2-playcompat.clipboardfix
      TERMUX_APK_VERSION_TAG: 1.6.2-playcompat-clipboardfix
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate diff
        run: git diff --check HEAD^ HEAD
      - name: Unit tests
        run: ./gradlew :app:testPlaycompatDebugUnitTest --no-daemon
      - name: Build ARM64 APK
        run: ./gradlew :app:assemblePlaycompatDebug --no-daemon
      - name: Collect artifact
        shell: bash
        run: |
          set -euo pipefail
          OUT=app/build/outputs/apk/playcompat/debug
          APK="$(find "$OUT" -maxdepth 1 -type f -name '*arm64-v8a.apk' -print -quit)"
          test -n "$APK"
          mkdir -p clipboard-fix-artifact
          cp "$APK" clipboard-fix-artifact/
          cp "$OUT/output-metadata.json" clipboard-fix-artifact/
          (cd clipboard-fix-artifact && sha256sum *.apk > SHA256SUMS.txt)
          cat clipboard-fix-artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        with:
          name: NewTermux-1.6.2-clipboard-fix-arm64-v8a
          path: clipboard-fix-artifact/
          retention-days: 7
