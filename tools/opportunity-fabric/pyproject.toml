[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunity-fabric"
version = "0.2.0"
description = "Zero-cost-first compute opportunity orchestrator with policy gates"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
of = "opportunity_fabric.cli:main"

[tool.setuptools.packages.find]
include = ["opportunity_fabric*"]
